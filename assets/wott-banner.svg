<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="WOTT — the check-in remote for whatisonthe.tv">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#134e4a"/>
      <stop offset="0.6" stop-color="#0f3a3f"/>
      <stop offset="1" stop-color="#0a2230"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg)"/>
  <!-- faint signal dots -->
  <g fill="#2dd4bf" opacity="0.12">
    <circle cx="640" cy="52" r="2"/><circle cx="700" cy="90" r="1.5"/><circle cx="1100" cy="60" r="2"/>
    <circle cx="1040" cy="330" r="1.5"/><circle cx="590" cy="340" r="2"/><circle cx="1150" cy="200" r="1.5"/>
    <circle cx="60" cy="40" r="1.5"/><circle cx="500" cy="30" r="1.5"/><circle cx="40" cy="360" r="2"/>
  </g>

  <!-- ===== retro telly ===== -->
  <g>
    <!-- antennae -->
    <g stroke="#4b5563" stroke-width="5" stroke-linecap="round">
      <line x1="255" y1="95" x2="185" y2="28"/>
      <line x1="285" y1="95" x2="355" y2="24"/>
    </g>
    <circle cx="185" cy="28" r="7" fill="#2dd4bf"/>
    <circle cx="355" cy="24" r="7" fill="#38bdf8"/>

    <!-- body -->
    <rect x="90" y="92" width="380" height="246" rx="30" fill="#1f2937" stroke="#374151" stroke-width="3"/>
    <!-- feet -->
    <rect x="140" y="336" width="46" height="16" rx="8" fill="#374151"/>
    <rect x="380" y="336" width="46" height="16" rx="8" fill="#374151"/>

    <!-- screen -->
    <rect x="114" y="116" width="266" height="198" rx="18" fill="url(#screenGlow)" stroke="#0f766e" stroke-width="2"/>
    <!-- WOTT on screen -->
    <text x="247" y="232" text-anchor="middle" filter="url(#glow)"
          font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="72" font-weight="800" letter-spacing="4" fill="#5eead4">WOTT</text>
    <text x="247" y="270" text-anchor="middle"
          font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="17" letter-spacing="6" fill="#99f6e4" opacity="0.85">SAY "WHAT"</text>
    <!-- CRT scanlines + glass shine -->
    <rect x="114" y="116" width="266" height="198" rx="18" fill="url(#scanlines)"/>
    <path d="M132 128 q100 -14 230 6 l0 26 q-130 -22 -230 -4 z" fill="#ffffff" opacity="0.05"/>

    <!-- control panel -->
    <g>
      <circle cx="424" cy="150" r="15" fill="#111827" stroke="#4b5563" stroke-width="3"/>
      <line x1="424" y1="150" x2="433" y2="140" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
      <circle cx="424" cy="196" r="15" fill="#111827" stroke="#4b5563" stroke-width="3"/>
      <line x1="424" y1="196" x2="414" y2="187" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
      <g stroke="#4b5563" stroke-width="3" stroke-linecap="round">
        <line x1="410" y1="232" x2="438" y2="232"/>
        <line x1="410" y1="244" x2="438" y2="244"/>
        <line x1="410" y1="256" x2="438" y2="256"/>
        <line x1="410" y1="268" x2="438" y2="268"/>
      </g>
    </g>

    <!-- check-in badge, stamped over the corner -->
    <g filter="url(#glow)">
      <circle cx="382" cy="300" r="30" fill="#10b981"/>
      <path d="M366 300 l11 11 l21 -22" fill="none" stroke="#062a1f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ===== copy ===== -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="540" y="150" font-size="56" font-weight="800" fill="#f3f4f6">The check-in remote</text>
    <text x="540" y="205" font-size="56" font-weight="800" fill="url(#teal)">for whatisonthe.tv</text>
    <text x="540" y="252" font-size="22" fill="#9ca3af">Open. Tap. Checked in — under three seconds, every time.</text>

    <!-- pills -->
    <g font-size="17" font-weight="600">
      <rect x="540" y="284" width="150" height="38" rx="19" fill="none" stroke="#2dd4bf" stroke-width="2"/>
      <text x="615" y="309" text-anchor="middle" fill="#5eead4">iOS · Android</text>
      <rect x="702" y="284" width="128" height="38" rx="19" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <text x="766" y="309" text-anchor="middle" fill="#7dd3fc">local-first</text>
      <rect x="842" y="284" width="176" height="38" rx="19" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <text x="930" y="309" text-anchor="middle" fill="#c4b5fd">built by agents</text>
    </g>
  </g>
</svg>
